
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir proyecto
          unzip -q *.zip -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
